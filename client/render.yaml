services:
  # ─── Backend API ───────────────────────────────
  - type: web
    name: docrisk-voice-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 3000

  # ─── Frontend ──────────────────────────────────
  - type: web
    name: docrisk-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html