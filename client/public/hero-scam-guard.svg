<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="hs-g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="hs-g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="hs-glass" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="hs-hub" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#7f1d1d" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="hs-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Ambient halo -->
  <ellipse cx="260" cy="210" rx="210" ry="190" fill="url(#hs-hub)"/>
